let r2tp={};
function blankReads(){const o={};TPS.forEach(t=>o[t.key]=blankTP());return o;}
function ensureRely(){if(!state.reliability||typeof state.reliability!=="object")state.reliability={size:18,subset:[],reads:{}};
  const r=state.reliability;if(!Array.isArray(r.subset))r.subset=[];if(!r.reads||typeof r.reads!=="object")r.reads={};if(!r.size)r.size=18;
  Object.keys(r.reads).forEach(k=>{const rd=r.reads[k];if(rd&&typeof rd==="object"&&!rd.PreOp&&rd.static){const m=blankReads();m["2y"]=rd;r.reads[k]=m;}});
  return r;}
function relyEligible(){return state.patients.map((p,i)=>i).filter(i=>patientStatus(state.patients[i])!=="empty");}
function readsHaveData(r){return Object.keys(r.reads||{}).some(k=>{const rd=r.reads[k];if(!rd||typeof rd!=="object")return false;
  return TPS.some(t=>{const d=rd[t.key];if(!d)return false;
    if(LEVELS.some(L=>(d.static[L]||"")!==""||(d.flex[L]||"")!==""||(d.ext[L]||"")!==""))return true;
    if((d.galign||"")!==""||(d.gflex||"")!==""||(d.gext||"")!==""||(d.sva||"")!==""||(d.t1slope||"")!==""||(d.c7slope||"")!=="")return true;
    return (Object.keys(d.asd||{}).length>0)||(Object.keys(d.ho||{}).length>0);});});}
function selectSubset(){const r=ensureRely();

  const elig=relyEligible(),k=Math.max(1,Math.min(r.size|0,elig.length));
  const a=elig.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  r.subset=a.slice(0,k).sort((x,y)=>x-y);r.reads={};persist();renderReliability();
  toast(`Selected ${r.subset.length} patient${r.subset.length>1?"s":""}`);}
function simulateReads(){const r=ensureRely();if(!r.subset.length){toast("Select a subset first");return;}
  const nz=sd=>(Math.random()+Math.random()+Math.random()-1.5)*sd*2;
  r.subset.forEach(idx=>{const p=state.patients[idx],reads=blankReads();
    TPS.forEach(t=>{const src=p.data[t.key],d=reads[t.key];
      LEVELS.forEach(L=>{const st=numv(src.static[L]),fl=numv(src.flex[L]),ex=numv(src.ext[L]);
        d.static[L]=st==null?"":(st+nz(0.9)).toFixed(1);d.flex[L]=fl==null?"":(fl+nz(0.9)).toFixed(1);d.ext[L]=ex==null?"":(ex+nz(0.9)).toFixed(1);});
      const ga=numv(src.galign),gf=numv(src.gflex),ge=numv(src.gext),sv=numv(src.sva),t1=numv(src.t1slope),c7=numv(src.c7slope);
      d.galign=ga==null?"":(ga+nz(1.2)).toFixed(1);d.gflex=gf==null?"":(gf+nz(1.4)).toFixed(1);d.gext=ge==null?"":(ge+nz(1.4)).toFixed(1);

      cdrLevels(p).forEach(L=>{const g=hoNum(src.ho[L]);if(g==null)return;let g2=g;if(Math.random()<0.12)g2=Math.max(0,Math.min(4,g+(Math.random()<0.5?-1:1)));d.ho[L]=HOTOK[g2];});});

  for(const L of LEVELS){if(numv(o.static[L])!=null&&numv(d.static[L])==null)return false;
    if(numv(o.flex[L])!=null&&numv(d.flex[L])==null)return false;if(numv(o.ext[L])!=null&&numv(d.ext[L])==null)return false;}
  if(numv(o.galign)!=null&&numv(d.galign)==null)return false;if(numv(o.gflex)!=null&&numv(d.gflex)==null)return false;if(numv(o.gext)!=null&&numv(d.gext)==null)return false;
  if(numv(o.sva)!=null&&numv(d.sva)==null)return false;
  if(o.t1nv){if(numv(o.c7slope)!=null&&numv(d.c7slope)==null)return false;}else{if(numv(o.t1slope)!=null&&numv(d.t1slope)==null)return false;}
  const adj=adjacentLevels(p);for(const L of[adj.upper,adj.lower])if(L&&asdNum(o.asd[L])!=null&&asdNum(d.asd[L])==null)return false;
  for(const L of cdrLevels(p))if(hoNum(o.ho[L])!=null&&hoNum(d.ho[L])==null)return false;return true;}
function r2complete(p,reads){if(!reads)return false;
  let any=false;for(const t of TPS){if(tpStatus(p,t.key)==="empty")continue;any=true;if(!r2tpComplete(p,reads[t.key],t.key))return false;}return any;}

function computeReliability(){const r=ensureRely();
  const A={st:[],rom:[],grom:[],sva:[],t1:[]},O={asd:[],ho:[]};
  r.subset.forEach(idx=>{const p=state.patients[idx],reads=r.reads[idx];if(!reads)return;
    TPS.forEach(t=>{const d1=p.data[t.key],d2=reads[t.key];if(!d2)return;
    LEVELS.forEach(L=>{const a=numv(d1.static[L]),b=numv(d2.static[L]);if(a!=null&&b!=null)A.st.push([a,b]);
      const r1=numv(romOf(d1,L).val),r2=numv(romOf(d2,L).val);if(r1!=null&&r2!=null)A.rom.push([r1,r2]);});
    const g1=numv(gromOf(d1).val),g2=numv(gromOf(d2).val);if(g1!=null&&g2!=null)A.grom.push([g1,g2]);
    const s1=numv(d1.sva),s2=numv(d2.sva);if(s1!=null&&s2!=null)A.sva.push([s1,s2]);
    if(!d1.t1nv&&!d2.t1nv){const a=numv(d1.t1slope),b=numv(d2.t1slope);if(a!=null&&b!=null)A.t1.push([a,b]);}
    const adj=adjacentLevels(p);[adj.upper,adj.lower].forEach(L=>{if(!L)return;const a=asdNum(d1.asd[L]),b=asdNum(d2.asd[L]);if(a!=null&&b!=null)O.asd.push([a,b]);});
    cdrLevels(p).forEach(L=>{const a=hoNum(d1.ho[L]),b=hoNum(d2.ho[L]);if(a!=null&&b!=null)O.ho.push([a,b]);});});});
  return{
    cont:[{k:"Static disc angle",pairs:A.st},{k:"Segmental ROM",pairs:A.rom},{k:"Global ROM (C2–C7)",pairs:A.grom},
      {k:"C2–C7 SVA",pairs:A.sva},{k:"T1 slope",pairs:A.t1}].map(o=>({...o,icc:o.pairs.length>=2?icc21(o.pairs):null})),
    ord:[{k:"ASD grade (Kellgren–Lawrence)",pairs:O.asd,R:5},{k:"HO grade (McAfee)",pairs:O.ho,R:5}].map(o=>({...o,kappa:o.pairs.length>=2?weightedKappa(o.pairs,o.R):null}))
  };
}
function methodsSentence(R){const r=ensureRely(),k=r.subset.length,pct=state.patients.length?Math.round(100*k/state.patients.length):0;
  const cont=R.cont.filter(o=>o.icc&&isFinite(o.icc.icc)),ord=R.ord.filter(o=>o.kappa&&isFinite(o.kappa.kappa));
  if(!cont.length&&!ord.length)return `<div class="interp">Enter or simulate second reads to compute agreement statistics.</div>`;
  const cTxt=cont.map(o=>`${o.k.toLowerCase()} ${o.icc.icc.toFixed(2)}`).join("; ");
  const oTxt=ord.map(o=>`${o.k.split(" (")[0].toLowerCase()} ${o.kappa.kappa.toFixed(2)}`).join("; ");
  let s=`Observer reliability was assessed on a random subset of <b>${k} patients (${pct}% of the cohort)</b>, each re-measured independently and blinded to the first reading. `;
  if(cont.length)s+=`Intraclass correlation coefficients (two-way random effects, single measures, absolute agreement) were ${cTxt}. `;
  if(ord.length)s+=`Quadratic-weighted κ for ordinal grades was ${oTxt}.`;
  return `<div class="interp"><b>Draft methods text</b><br>${s}</div>`;
}
function buildStatsHTML(){const R=computeReliability();
  let t=`<table class="stat-tbl"><tr><th>Measurement</th><th style="text-align:right">ICC / κ</th><th style="text-align:right">Pairs</th><th>Agreement</th></tr>`;
  t+=`<tr class="ghead"><td colspan="4">Continuous — ICC(2,1), absolute agreement</td></tr>`;
  R.cont.forEach(o=>{const v=o.icc&&isFinite(o.icc.icc)?o.icc.icc:null,b=iccBadge(v);
    t+=`<tr><td>${o.k}</td><td class="num">${v==null?"–":v.toFixed(3)}</td><td class="np">${o.pairs.length||"–"}</td><td><span class="badge ${b[0]}">${b[1]}</span></td></tr>`;});
  t+=`<tr class="ghead"><td colspan="4">Ordinal — quadratic-weighted κ</td></tr>`;
  R.ord.forEach(o=>{const v=o.kappa&&isFinite(o.kappa.kappa)?o.kappa.kappa:null,b=kapBadge(v);
    t+=`<tr><td>${o.k}</td><td class="num">${v==null?"–":v.toFixed(3)}</td><td class="np">${o.pairs.length||"–"}</td><td><span class="badge ${b[0]}">${b[1]}</span></td></tr>`;});
  t+=`</table>`+methodsSentence(R);return t;}

function klR2(idx,L,val,tk){const opts=[["0","0 None"],["1","1 Doubtful"],["2","2 Minimal"],["3","3 Moderate"],["4","4 Severe"]];
  return `<select class="r2sel" data-r2asd="${idx}" data-tk="${tk}" data-l="${L}"><option value="">—</option>`+opts.map(o=>`<option value="${o[0]}" ${val===o[0]?"selected":""}>${o[1]}</option>`).join("")+`</select>`;}
function hoR2(idx,L,val,tk){return `<select class="r2sel" data-r2ho="${idx}" data-tk="${tk}" data-l="${L}"><option value="">—</option>`+HOTOK.map(t=>`<option value="${t}" ${val===t?"selected":""}>${t}</option>`).join("")+`</select>`;}
function r2GridHTML(p,idx){const r=ensureRely();if(!r.reads[idx]||!r.reads[idx].PreOp)r.reads[idx]=blankReads();const reads=r.reads[idx];
  const firstTk=(TPS.find(t=>tpStatus(p,t.key)!=="empty")||TPS[0]).key,tk=r2tp[idx]||firstTk,d=reads[tk];
  const pills=TPS.map(t=>{const origHas=tpStatus(p,t.key)!=="empty",done=origHas&&r2tpComplete(p,reads[t.key],t.key);
    return `<button class="pill ${origHas?(done?"complete":"incomplete"):""} ${t.key===tk?"active":""}" data-r2tp="${idx}" data-tk="${t.key}" ${origHas?"":'style="opacity:.4"'}>${t.short}</button>`;}).join("");
  let h=`<div class="r2tphint">Re-read every timepoint the first observer recorded · editing <b style="color:var(--cyan)">${(TPS.find(t=>t.key===tk)||{}).label||tk}</b></div><div class="tps">${pills}</div>`+
    `<div class="r2grid"><div class="r2h">Level</div><div class="r2h">Static</div><div class="r2h">Flex</div><div class="r2h">Ext</div><div class="r2h">ROM</div>`;
  LEVELS.forEach(L=>{const rom=romOf(d,L);
    h+=`<div class="r2lv">${L}</div>`+["static","flex","ext"].map(meas=>`<input data-r2="${idx}" data-tk="${tk}" data-m="${meas}" data-l="${L}" inputmode="decimal" value="${esc(d[meas][L])}">`).join("")+
      `<div class="r2rom" id="r2rom_${idx}_${L.replace("/","")}">${rom.val===""?"–":rom.val}</div>`;});
  h+=`</div><div class="r2sub">Global C2–C7</div><div class="r2flex">`+
    [["galign","Static"],["gflex","Flex"],["gext","Ext"]].map(a=>`<div class="r2f"><label>${a[1]}</label><input data-r2="${idx}" data-tk="${tk}" data-g="${a[0]}" inputmode="decimal" value="${esc(d[a[0]])}"></div>`).join("")+
    `<div class="r2f"><label>ROM</label><input id="r2grom_${idx}" value="${gromOf(d).val===""?"":gromOf(d).val}" readonly style="color:var(--green)"></div></div>`+
    `<div class="r2flex"><div class="r2f"><label>C2–C7 SVA</label><input data-r2="${idx}" data-tk="${tk}" data-g="sva" inputmode="decimal" value="${esc(d.sva)}"></div>`+
    (d.t1nv?`<div class="r2f"><label>C7 slope</label><input data-r2="${idx}" data-tk="${tk}" data-g="c7slope" inputmode="decimal" value="${esc(d.c7slope)}"></div>`
           :`<div class="r2f"><label>T1 slope</label><input data-r2="${idx}" data-tk="${tk}" data-g="t1slope" inputmode="decimal" value="${esc(d.t1slope)}"></div>`)+`</div>`;
  const adj=adjacentLevels(p),adjL=[adj.upper,adj.lower].filter(Boolean);
  if(adjL.length){h+=`<div class="r2sub">Adjacent-segment grade (K–L)</div>`;adjL.forEach(L=>h+=`<div class="r2row"><span class="r2lab">${L}</span>${klR2(idx,L,asdVal(d,L),tk)}</div>`);}
  const cl=cdrLevels(p);
  if(cl.length){h+=`<div class="r2sub">HO grade (McAfee)</div>`;cl.forEach(L=>h+=`<div class="r2row"><span class="r2lab">${L}</span>${hoR2(idx,L,hoVal(d,L),tk)}</div>`);}
  return h;}
function relySave(idx){markDirty();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();updateR2Dot(idx);updateRelyStats();},350);}
function updateR2Dot(idx){const el=document.getElementById("rdot_"+idx);if(el)el.classList.toggle("done",r2complete(state.patients[idx],ensureRely().reads[idx]));}
function updateRelyStats(){const el=document.getElementById("relyStats");if(el)el.innerHTML=buildStatsHTML();}
function bindR2(){
  document.querySelectorAll("input[data-r2]").forEach(inp=>{inp.oninput=()=>{const idx=+inp.dataset.r2,tk=inp.dataset.tk,reads=ensureRely().reads[idx];if(!reads||!reads[tk])return;const d=reads[tk];
    if(inp.dataset.m){d[inp.dataset.m][inp.dataset.l]=inp.value;const L=inp.dataset.l,rc=document.getElementById("r2rom_"+idx+"_"+L.replace("/",""));if(rc){const rv=romOf(d,L).val;rc.textContent=rv===""?"–":rv;}}
    else if(inp.dataset.g){d[inp.dataset.g]=inp.value;if(inp.dataset.g==="gflex"||inp.dataset.g==="gext"){const gc=document.getElementById("r2grom_"+idx);if(gc){const gv=gromOf(d).val;gc.value=gv===""?"":gv;}}}
    relySave(idx);};});
  document.querySelectorAll("select[data-r2asd]").forEach(s=>{s.onchange=()=>{const idx=+s.dataset.r2asd,tk=s.dataset.tk,reads=ensureRely().reads[idx];if(!reads||!reads[tk])return;const d=reads[tk];if(s.value==="")delete d.asd[s.dataset.l];else d.asd[s.dataset.l]=s.value;relySave(idx);};});
  document.querySelectorAll("select[data-r2ho]").forEach(s=>{s.onchange=()=>{const idx=+s.dataset.r2ho,tk=s.dataset.tk,reads=ensureRely().reads[idx];if(!reads||!reads[tk])return;const d=reads[tk];if(s.value==="")delete d.ho[s.dataset.l];else d.ho[s.dataset.l]=s.value;relySave(idx);};});
  document.querySelectorAll("[data-r2tp]").forEach(b=>{b.onclick=()=>{const idx=+b.dataset.r2tp;r2tp[idx]=b.dataset.tk;
    const card=b.closest(".ssitem"),body=card?card.querySelector(".ssbody"):null;if(body){body.innerHTML=r2GridHTML(state.patients[idx],idx);bindR2();}updateR2Dot(idx);};});
}
function renderReliability(){const m=document.getElementById("main"),r=ensureRely();
  r.subset=r.subset.filter(i=>i>=0&&i<state.patients.length);
  const elig=relyEligible();
  let html=`<div class="rely"><div class="sech">Observer reliability</div>`+
    `<div class="panel-note">Designate a random subset of patients, then record a <b>second, blinded reading of every timepoint</b> for each — or use <b>Simulate</b> to preview the analysis on synthetic re-reads. The tool pools read 1 vs read 2 across all timepoints in the subset and computes <b>ICC</b> for continuous measures and <b>quadratic-weighted κ</b> for ordinal grades.</div>`+
    `<div class="rctl"><div class="rf"><label>Subset size</label><input type="number" id="ssSize" min="1" max="${Math.max(1,elig.length)}" value="${Math.min(r.size,elig.length)||1}"></div>`+
    `<button class="btn primary" id="ssPick">Select random subset</button>`+
    `<button class="btn" id="ssSim">Simulate second reads</button>`+
    (r.subset.length?`<button class="btn" id="ssClear">Clear</button>`:``)+`</div>`;
  if(!elig.length){html+=`<div class="blank" style="min-height:26vh"><div><h3>No measurements yet</h3>Enter some patient measurements in the Data tab first.</div></div></div>`;m.innerHTML=html;bindRelyCtl(elig);return;}
  if(!r.subset.length){html+=`<div class="blank" style="min-height:26vh"><div><h3>No subset selected</h3>Pick a size, then tap “Select random subset”.</div></div></div>`;m.innerHTML=html;bindRelyCtl(elig);return;}
  html+=`<div class="subsetlist">`;
  r.subset.forEach(idx=>{const p=state.patients[idx],done=r2complete(p,r.reads[idx]);
    const meta=[(p.age?p.age+"y":""),p.sex,(p.levels||[]).join("/")].filter(Boolean).join(" · ");
    html+=`<div class="ssitem" data-ss="${idx}"><div class="ssh" tabindex="0" role="button"><span class="chev">▸</span><span class="ssid">${esc(p.initials)||"····"}</span><span class="ssm">${esc(meta)}</span><span class="ssr"><span class="rdot ${done?"done":""}" id="rdot_${idx}"></span></span></div><div class="ssbody">${r2GridHTML(p,idx)}</div></div>`;});
  html+=`</div><div class="chartcard" style="margin-top:14px"><div class="ct">Agreement — read 1 vs read 2</div><div id="relyStats">${buildStatsHTML()}</div></div></div>`;
  m.innerHTML=html;bindRelyCtl(elig);
  document.querySelectorAll(".ssitem .ssh").forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle("open");
    h.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();h.click();}};});
  bindR2();
}
function bindRelyCtl(elig){const r=ensureRely();
  const sz=document.getElementById("ssSize");if(sz)sz.oninput=e=>{r.size=Math.max(1,Math.min(elig.length,+e.target.value||1));};
  const pk=document.getElementById("ssPick");if(pk)pk.onclick=()=>{const v=+document.getElementById("ssSize").value||1;r.size=Math.max(1,Math.min(elig.length,v));selectSubset();};
  const sm=document.getElementById("ssSim");if(sm)sm.onclick=simulateReads;
  const cl=document.getElementById("ssClear");if(cl)cl.onclick=()=>{if(readsHaveData(r)&&!confirm("Clear the subset and second readings?\n\nThis discards everything entered in this tab."))return;r.subset=[];r.reads={};persist();renderReliability();};
}

restore();histCurrent=snapState();updateUndoBtns();renderAll();fileTryReconnect();cloudInit();
</script>
