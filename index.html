<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cervical Disc Replacement Radiographic Study</title>
<style>
  :root{
    --bg:#0e1216; --panel:#151b21; --panel2:#1b232b; --raised:#212c35;
    --border:#2a353f; --border2:#374550;
    --text:#e8eef4; --muted:#8a99a7; --faint:#5d6b78;
    --cyan:#4cc9e6; --cyan-dim:#1d3d47;
    --amber:#f0a93b; --amber-dim:#3a2c12;
    --green:#46c98b; --green-dim:#163026; --red:#e8645f;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%}
  /* app frame: header/nav/footer fixed, the content pane is the one scroll area */
  body{display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}

  /* ---- top bar ---- */
  .topbar{flex:0 0 auto;z-index:30;display:flex;align-items:center;gap:10px;
    padding:8px 12px;background:linear-gradient(180deg,#11171d,#0e1216);
    border-bottom:1px solid var(--border)}
  .brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--text);white-space:nowrap}
  .brand h1 .dot{color:var(--cyan);margin-right:7px}
  .nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .nav .counter{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:54px;text-align:center}
  .iconbtn{width:34px;height:34px;border:1px solid var(--border2);background:var(--panel2);
    color:var(--text);border-radius:8px;font-size:18px;display:grid;place-items:center;transition:.12s}
  .iconbtn:hover{border-color:var(--cyan);color:var(--cyan)}
  .iconbtn:disabled{opacity:.3;cursor:not-allowed}
  .btn{border:1px solid var(--border2);background:var(--panel2);color:var(--text);
    border-radius:8px;padding:8px 13px;font-size:12px;font-weight:500;transition:.12s}
  .btn:hover{border-color:var(--cyan);color:var(--cyan)}
  .btn.primary{background:var(--cyan);border-color:var(--cyan);color:#06222b;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08);color:#06222b}

  /* ---- layout ---- */
  .shell{display:grid;grid-template-columns:76px 1fr;flex:1 1 auto;min-height:0;overflow:hidden}
  @media(min-width:680px){.shell{grid-template-columns:152px 1fr}}
  .roster{border-right:1px solid var(--border);background:var(--panel);
    padding:8px 5px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;
    min-height:0}
  .roster h2{font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:2px 4px 6px;font-weight:600}
  .rosteritem{display:flex;flex-direction:column;gap:1px;padding:6px 6px;border-radius:7px;
    border:1px solid transparent;transition:.1s;min-width:0}
  .rosteritem:hover{background:var(--panel2)}
  .rosteritem.active{background:var(--cyan-dim);border-color:#2f5a66}
  .ri-top{display:flex;align-items:center;gap:5px;min-width:0}
  .rosteritem .serial{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);
    flex:0 0 auto;letter-spacing:0}
  .rosteritem.active .serial{color:var(--cyan)}
  .rosteritem .pid{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .rosteritem .pmeta{color:var(--muted);font-size:10.5px;font-family:var(--mono);
    padding-left:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
  .dot.part{background:var(--amber)} .dot.full{background:var(--green)}
  .dot.red{background:var(--red)} .dot.blue{background:var(--cyan)}
  .dot.green{background:var(--green);box-shadow:0 0 6px rgba(70,201,139,.7)}
  .roster .empty{color:var(--faint);font-size:11px;padding:10px 6px;text-align:center;line-height:1.5}

  .main{padding:14px 14px 40px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 15px;margin-bottom:14px}
  .card > .label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cyan);font-weight:600;margin-bottom:12px}

  /* ---- demographics ---- */
  .demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:13px 15px;align-items:start}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field label{font-size:10px;color:var(--muted);letter-spacing:.03em;font-weight:500;text-transform:uppercase}
  .field .hint{font-size:10px;color:var(--faint);text-transform:none;letter-spacing:0}
  input[type=text],input[type=number]{
    background:var(--panel2);border:1px solid var(--border2);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:15px;transition:.12s;width:100%}
  input[type=number]{font-family:var(--mono);text-align:right}
  input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
  input.caps{text-transform:uppercase}

  /* ---- identity block: Name · IC · Age · Sex on row 1, Op date · Implant on row 2 ---- */
  .idblock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;align-items:end;margin-bottom:7px}
  .idblock .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .idblock .f label{font-size:9.5px;color:var(--muted);letter-spacing:.02em;font-weight:600;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
  .idblock .f .hint{font-size:8.5px;color:var(--faint);text-transform:none;letter-spacing:0;font-weight:500}
  .idblock input[type=text],.idblock input[type=number]{padding:8px 7px;font-size:15px;width:100%}
  .idblock .f.age input{text-align:center}
  .idblock .sexwrap{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .idblock .sexwrap .tg{padding:8px 2px;font-size:14px;text-align:center}
  .idblock .f.date{grid-column:span 2}
  .idblock .f.imp{grid-column:span 2}
  .idblock .f.imp .isel{padding:9px 26px 9px 10px;font-size:14px;width:100%}
  .idblock .f.imp #f_impother{margin-top:5px;width:100%}
  .isel{width:100%;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;
    color:var(--text);font-size:14px;padding:10px 30px 10px 11px;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237b8a99' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center}
  .isel:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}
  .isel option{background:#1b232b;color:var(--text)}

  .tg-row{display:flex;flex-wrap:wrap;gap:7px}
  .tg{font-size:13px;padding:9px 15px;border-radius:8px;border:1px solid var(--border2);
    background:var(--panel2);color:var(--muted);transition:.1s;font-weight:500}
  .tg:hover{border-color:var(--border2);color:var(--text)}
  .tg.on{background:var(--cyan);border-color:var(--cyan);color:#06222b;font-weight:600}
  [data-fused="yes"].on{background:var(--amber);border-color:var(--amber);color:#2a1c06}

  .chip{font-family:var(--mono);font-size:13px;padding:8px 12px;border-radius:7px;
    border:1px solid var(--border2);background:var(--panel2);color:var(--muted);transition:.1s}
  .chip:hover{color:var(--text)}
  .chip.cdr{background:var(--cyan);border-color:var(--cyan);color:#06222b;font-weight:600}
  .chip.acdf{background:#bb7d42;border-color:#bb7d42;color:#2a1808;font-weight:600}
  .chip.acdf:hover{filter:brightness(1.07)}
  .lvl-legend{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:10.5px;
    color:var(--faint);font-family:var(--sans);letter-spacing:.02em}
  .lvl-legend .lk{font-size:12px;line-height:1}
  .lvl-legend .lk.cdr{color:var(--cyan)} .lvl-legend .lk.acdf{color:#bb7d42}
  .lvl-hint{margin-top:8px;font-size:11px;color:#c98f5a;font-family:var(--sans);line-height:1.4}
  .levelcount{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .levelcount b{color:var(--cyan);font-weight:700}
  .levelcount .acdfc b{color:#c98f5a}
  .hidden{display:none}

  /* ---- timepoint pills with completeness glow ---- */
  .tps{display:flex;gap:6px;margin-bottom:9px}
  .pill{flex:1;min-width:0;position:relative;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:700;
    border:1px solid var(--border2);background:var(--panel2);color:var(--muted);transition:.18s;
    display:flex;align-items:center;justify-content:center;gap:5px;letter-spacing:.02em}
  .pill:hover{color:var(--text)}
  .pill .pc{font-family:var(--mono);font-size:11px;opacity:.85}
  .pill.complete{color:#cfeefb;border-color:var(--cyan);
    background:linear-gradient(180deg,rgba(76,201,230,.20),var(--cyan-dim));
    box-shadow:0 0 0 1px var(--cyan) inset,0 0 17px -2px rgba(76,201,230,.85)}
  .pill.incomplete{color:#f6cdcb;border-color:var(--red);
    background:linear-gradient(180deg,rgba(232,100,95,.16),rgba(232,100,95,.05));
    box-shadow:0 0 0 1px var(--red) inset,0 0 17px -2px rgba(232,100,95,.78)}
  .pill.active{transform:translateY(-1px)}
  .pill.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-6px;height:3px;
    border-radius:3px;background:currentColor;opacity:.9}
  .legend{font-size:10.5px;color:var(--faint);margin-bottom:15px;font-family:var(--mono)}
  .legend b.bl{color:var(--cyan)} .legend b.rd{color:var(--red)}

  /* ---- measurement grid ---- */
  .grid-wrap{display:flex;flex-direction:column;gap:14px}
  .mgrid{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .mgrid .ghead,.mrow{display:grid;grid-template-columns:46px 1fr 1fr 1fr 1fr}
  .mgrid .ghead{background:var(--panel2);border-bottom:1px solid var(--border)}
  .mgrid .ghead div{padding:8px 5px;font-size:8.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
  .mgrid .ghead div:first-child{color:var(--faint)}
  .mrow{border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:none}
  .mrow .lvl{padding:0 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);
    background:var(--panel);border-right:1px solid var(--border);line-height:1.05;text-align:center}
  .mrow .lvl.cdr{color:var(--cyan)} .mrow .lvl.fused{color:var(--amber)}
  .lvl .tag{font-size:7.5px;background:var(--amber-dim);color:var(--amber);
    padding:1px 3px;border-radius:3px;margin-top:2px;letter-spacing:.04em}
  .lvl .lvname{font-size:11.5px;font-weight:700;line-height:1.05}
  .lvl .tpt{font-size:7.5px;letter-spacing:.09em;color:var(--faint);
    background:var(--panel2);border:1px solid var(--border);border-radius:3px;
    padding:1px 3px;margin-top:3px;font-weight:700}
  .cell{position:relative;border-right:1px solid var(--border)}
  .cell input{background:transparent;border:none;text-align:center;font-family:var(--mono);
    font-size:13px;padding:12px 2px;width:100%;color:var(--text)}
  .cell input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--cyan);background:var(--cyan-dim)}
  .cell.unitcell input{text-align:right;padding-right:11px}
  .cell .cunit{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:9px;
    color:var(--faint);pointer-events:none;display:none;font-family:var(--mono)}
  .cell.unitcell.hasval .cunit{display:block}
  .cell.flag input{color:var(--amber)}
  .cell.flag::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
  /* required-but-empty: red reminder while a timepoint is in progress */
  .cell.need{box-shadow:inset 0 0 0 1.5px rgba(232,100,95,.7);background:rgba(232,100,95,.07)}
  .gsubf.need{border-color:var(--red);box-shadow:0 0 0 1px rgba(232,100,95,.45)}
  .hobtns.need{box-shadow:inset 0 0 0 1.5px rgba(232,100,95,.5);border-radius:8px}
  /* read-only computed ROM cell */
  .romcell{position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-weight:700;color:var(--green);
    background:rgba(70,201,139,.07)}
  .romcell.legacy{color:var(--muted);font-weight:600}
  .romcell.flag{color:var(--amber);background:rgba(240,169,59,.09)}
  .romcell .rom-empty{color:var(--faint);font-weight:400}
  .romcell .rtag{position:absolute;top:3px;right:4px;font-size:8px;color:var(--faint);
    border:1px solid var(--border2);border-radius:3px;padding:0 2px;font-weight:600}

  /* ---- global summary grid (mirrors measurement grid) ---- */
  .gsec{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
  .gsec .gtitle{display:flex;align-items:center;gap:9px;padding:9px 12px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:1px solid var(--border)}
  .gsec .gtitle b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);font-weight:700}
  .gsec .gtitle .gtp{font-size:10px;color:var(--faint);font-family:var(--mono);
    border:1px solid var(--border2);border-radius:5px;padding:1px 7px;letter-spacing:.04em}
  .gsec .mgrid{border:none;border-radius:0}
  .ggrid .ghead,.ggrid .grow{display:grid}
  .ggrid.g4 .ghead,.ggrid.g4 .grow{grid-template-columns:46px 1fr 1fr 1fr 1fr}
  .ggrid .grow .glvl{display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);
    background:var(--panel);letter-spacing:.02em}
  .ggrid.g1 .ghead,.ggrid.g1 .grow{grid-template-columns:1fr}
  /* ASD adjacency layout */
  .ggrid.gasd .ghead,.ggrid.gasd .grow{grid-template-columns:46px 1fr 120px}
  .ggrid .grow .glvl.alvl{font-size:10.5px;color:var(--cyan)}
  .ggrid .grow .apos{display:flex;align-items:center;gap:7px;padding:0 12px;
    font-size:11px;color:var(--muted);font-family:var(--sans)}
  .ggrid .grow .apos .ar{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--cyan)}
  .ggrid .grow .apos .ref{font-family:var(--mono);color:var(--faint)}
  .grow.asd-skip .glvl.alvl{color:var(--faint)}
  .grow.asd-skip .apos,.grow.asd-skip .apos .ar{color:var(--faint)}
  .cell.na{display:flex;align-items:center;justify-content:center;font-size:9px;
    color:var(--faint);font-family:var(--mono);letter-spacing:.03em}
  .asd-msg{padding:14px;font-size:11.5px;color:var(--faint);line-height:1.55;font-family:var(--sans)}
  .cell select{background:transparent;border:none;color:var(--text);font-family:var(--mono);
    font-size:12.5px;text-align:center;text-align-last:center;width:100%;padding:11px 18px 11px 8px;
    cursor:pointer;-webkit-appearance:none;appearance:none}
  .cell select:focus{outline:none;box-shadow:inset 0 0 0 2px var(--cyan);background:var(--cyan-dim)}
  .cell select option{background:#1b232b;color:var(--text)}
  .cell.klcell{position:relative}
  .cell.klcell::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font-size:9px;color:var(--faint);pointer-events:none}
  .gsec .gtitle .gclass{font-size:9.5px;color:var(--faint);font-family:var(--sans);letter-spacing:.02em}
  /* global neutral-alignment sub-fields: T1 slope, C2–C7 SVA — stacked horizontal rows */
  .gsub{display:flex;flex-direction:column;gap:9px;padding:11px 12px;border-top:1px solid var(--border)}
  .gsubf{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--panel2);
    border:1px solid var(--border2);border-radius:9px;padding:8px 11px}
  .gsubf.flag{border-color:var(--amber)}
  .gsubf.disabled{opacity:.5}
  .gsubf > label{font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0;flex:0 0 auto;min-width:82px}
  .gsubf .fallback{color:var(--cyan);font-size:8px;border:1px solid var(--cyan-dim);border-radius:3px;padding:0 3px;margin-left:4px;letter-spacing:.04em}
  .gsubf .ufield{flex:0 0 auto;width:104px}
  .gsubf input[type=number]{background:var(--panel);border:1px solid var(--border2);width:100%}
  .gsubf .t1nv{display:flex;align-items:center;gap:6px;margin:0 0 0 auto;font-size:11px;color:var(--muted);
    text-transform:none;letter-spacing:0;font-weight:500;cursor:pointer;flex:0 0 auto}
  .gsubf .t1nv input{width:15px;height:15px;accent-color:var(--cyan);cursor:pointer;margin:0}
  /* heterotopic ossification (McAfee) per CDR level */
  .hospacer{flex:1}
  .hotgl{font-size:9.5px;font-family:var(--mono);border:1px solid var(--border2);background:var(--panel2);
    color:var(--faint);border-radius:6px;padding:2px 8px;letter-spacing:.02em}
  .hotgl.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
  .hogrid{display:flex;flex-direction:column}
  .horow{display:grid;grid-template-columns:46px 1fr;align-items:center;border-bottom:1px solid var(--border)}
  .horow:last-child{border-bottom:none}
  .holvl{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cyan);text-align:center;
    padding:9px 3px;border-right:1px solid var(--border);background:var(--panel);align-self:stretch;display:flex;align-items:center;justify-content:center}
  .hobtns{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap}
  .hobtn{min-width:38px;font-family:var(--mono);font-size:13px;font-weight:700;padding:7px 4px;border-radius:7px;
    border:1px solid var(--border2);background:var(--panel2);color:var(--muted);transition:.1s}
  .hobtn:hover{color:var(--text)}
  .hobtn.on{background:var(--cyan);border-color:var(--cyan);color:#06222b}
  .ggrid .ghead{background:var(--panel2);border-bottom:1px solid var(--border)}
  .ggrid .ghead div{padding:7px 4px;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);font-weight:700;text-align:center}
  .ggrid .grow > *{border-right:1px solid var(--border)}
  .ggrid .grow > *:last-child{border-right:none}
  .ggrid .grow .cell input{text-align:center}
  .gromcell{position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:17px;font-weight:700;color:var(--green);
    background:linear-gradient(180deg,rgba(70,201,139,.14),var(--green-dim))}
  .gromcell.flag{color:var(--amber);background:rgba(240,169,59,.10)}
  .gromcell.legacy{color:var(--muted)}
  .gsec .gcap{font-size:9.5px;color:var(--faint);padding:7px 12px;border-top:1px solid var(--border);
    font-family:var(--mono);letter-spacing:.01em}

  textarea{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);
    border-radius:9px;padding:10px;font-family:var(--sans);font-size:14px;resize:vertical;min-height:54px}
  textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-dim)}

  /* ---- bottom bar ---- */
  .actionbar{flex:0 0 auto;z-index:40;display:flex;align-items:center;
    gap:6px;padding:8px 9px;background:linear-gradient(0deg,#11171d,#0e1216f0);
    border-top:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto}
  .actionbar::-webkit-scrollbar{height:0}
  .actionbar > *{flex:0 0 auto}
  .actionbar .btn{padding:7px 9px;font-size:11.5px;white-space:nowrap}
  .actionbar .iconbtn{width:30px;height:30px;font-size:16px}
  .savestate{font-size:11px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .savestate .sdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);transition:background .2s,box-shadow .2s}
  .savestate.dirty .sdot{background:var(--amber);box-shadow:0 0 7px var(--amber)}
  .savestate.error{color:var(--red);font-weight:700}
  .savestate.error .sdot{background:var(--red);box-shadow:0 0 7px var(--red)}
  .savegrp{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .savegrp .pcount{position:relative;padding-left:8px;font-size:11px}
  .savegrp .pcount::before{content:"·";position:absolute;left:1px;color:var(--faint)}
  .spacer{margin-left:auto}
  .toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--raised);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .blank{display:grid;place-items:center;min-height:55vh;text-align:center;color:var(--faint)}
  .blank h3{color:var(--muted);font-weight:500;margin:0 0 6px}
  .file-hidden{display:none}

  /* ---- view switcher ---- */
  .viewbar{flex:0 0 auto;z-index:25;display:flex;gap:4px;padding:7px 12px;
    background:linear-gradient(180deg,#10161c,#0e1216);border-bottom:1px solid var(--border)}
  .seg{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
    padding:8px 4px;border-radius:8px;border:1px solid var(--border2);background:var(--panel2);
    color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.01em;transition:.12s}
  .seg:hover{color:var(--text);border-color:var(--border2)}
  .seg.on{background:var(--cyan-dim);border-color:#2f5a66;color:var(--cyan)}
  .seg .si{font-size:12px;opacity:.85}
  .shell.full{grid-template-columns:1fr}
  .shell.full .roster{display:none}
  .topbar .nav.hide{display:none}

  /* ---- dashboard ---- */
  .dash{max-width:760px;margin:0 auto}
  .dash .sech{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);
    font-weight:600;margin:2px 0 11px}
  .metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .metric{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:12px 13px}
  .metric .mv{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--text);line-height:1.1}
  .metric .mv small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
  .metric .ml{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
  .chartcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 14px 11px;margin-bottom:14px}
  .chartcard .ct{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:2px}
  .chartcard .cs{font-size:10.5px;color:var(--faint);margin-bottom:10px}
  .chartcard svg{display:block;width:100%;height:auto;overflow:visible}
  .lgnd{display:flex;flex-wrap:wrap;gap:11px;margin-top:9px;font-size:10.5px;color:var(--muted)}
  .lgnd span{display:inline-flex;align-items:center;gap:5px}
  .lgnd i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .caxt{fill:var(--faint);font-size:9px;font-family:var(--mono)}
  .cvalt{fill:var(--muted);font-size:8.5px;font-family:var(--mono)}
  .cgl{stroke:var(--border);stroke-width:1}
  .cbl{stroke:var(--border2);stroke-width:1}

  /* ---- reliability ---- */
  .rely{max-width:760px;margin:0 auto}
  .panel-note{background:var(--panel2);border:1px solid var(--border);border-radius:11px;
    padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:14px}
  .panel-note b{color:var(--text);font-weight:600}
  .rctl{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}
  .rctl .rf{display:flex;flex-direction:column;gap:5px}
  .rctl .rf label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .rctl input[type=number]{width:76px}
  .stat-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .stat-tbl th,.stat-tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
  .stat-tbl th{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
  .stat-tbl td.num{font-family:var(--mono);text-align:right;color:var(--text);font-weight:600}
  .stat-tbl td.np{font-family:var(--mono);text-align:right;color:var(--muted);font-size:11px}
  .stat-tbl .ghead td{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);
    font-weight:700;padding-top:13px;border-bottom:1px solid var(--border2)}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.02em}
  .badge.exc{background:var(--green-dim);color:var(--green)}
  .badge.good{background:var(--cyan-dim);color:var(--cyan)}
  .badge.mod{background:var(--amber-dim);color:var(--amber)}
  .badge.poor{background:rgba(232,100,95,.14);color:var(--red)}
  .badge.na{background:var(--panel2);color:var(--faint)}
  .subsetlist{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
  .ssitem{border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden}
  .ssitem .ssh{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
  .ssitem .ssh:hover{background:var(--panel2)}
  .ssitem .ssid{font-family:var(--mono);font-weight:600;font-size:13px;min-width:46px}
  .ssitem .ssm{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .ssitem .ssr{margin-left:auto;display:flex;align-items:center;gap:9px}
  .rdot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .rdot.done{background:var(--green);box-shadow:0 0 6px var(--green)}
  .ssbody{padding:0 12px 12px;border-top:1px solid var(--border);display:none}
  .ssitem.open .ssbody{display:block}
  .ssitem.open .ssh .chev{transform:rotate(90deg)}
  .chev{color:var(--faint);transition:.15s;font-size:13px}
  .r2grid{display:grid;grid-template-columns:54px 1fr 1fr 1fr 1fr;gap:5px;align-items:center;margin-top:11px}
  .r2grid .r2h{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding-bottom:2px}
  .r2grid .r2lv{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .r2grid input{background:var(--panel2);border:1px solid var(--border2);color:var(--text);
    border-radius:7px;padding:7px 6px;font-size:14px;font-family:var(--mono);text-align:right;width:100%}
  .r2grid input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-dim)}
  .r2grid .r2rom{font-family:var(--mono);font-size:13px;text-align:right;color:var(--green);padding-right:4px}
  .r2sub{font-size:9px;color:var(--cyan);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin:14px 0 3px}
  .r2tphint{font-size:10.5px;color:var(--faint);margin:2px 0 8px;line-height:1.4}
  .r2tphint b{font-weight:700}
  .r2flex{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .r2f{display:flex;flex-direction:column;gap:4px;width:104px}
  .r2f label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .r2f input{background:var(--panel2);border:1px solid var(--border2);color:var(--text);border-radius:7px;
    padding:7px 8px;font-size:14px;font-family:var(--mono);text-align:right;width:100%}
  .r2f input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan-dim)}
  .r2sel{background:var(--panel2);border:1px solid var(--border2);color:var(--text);border-radius:7px;
    padding:7px 8px;font-size:13px;width:100%}
  .r2row{display:flex;align-items:center;gap:9px;margin:7px 0}
  .r2row .r2lab{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:62px}
  .interp{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px;
    padding:11px 13px;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
  .interp b{color:var(--text)}

  /* ---- lock + delete ---- */
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .cardhead .label{margin-bottom:0}
  .pserial{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cyan);
    background:var(--cyan-dim);border:1px solid #2f5a66;border-radius:5px;padding:1px 6px;margin-left:7px;letter-spacing:.02em}
  .chead-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn.danger{border-color:#5a3030;color:var(--red);background:transparent}
  .btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(232,100,95,.08)}
  .btn.danger.sm{padding:6px 11px;font-size:12px}
  .lockwrap{display:flex;align-items:center}
  .lockbtn{display:inline-flex;align-items:center;gap:7px}
  .lockbtn span{font-size:13px}
  .lockbtn.locked{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);font-weight:600}
  .lockbtn.locked:hover{filter:brightness(1.1);color:var(--amber)}
  .lockbanner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(240,169,59,.10);
    border:1px solid var(--amber-dim);color:var(--amber);border-radius:11px;padding:11px 13px;
    margin-bottom:14px;font-size:12.5px;font-weight:600}
  .lockbanner .btn{margin-left:auto;color:var(--amber);border-color:var(--amber)}
  .lockbanner .btn:hover{background:rgba(240,169,59,.14)}
  .main.locked input:disabled,.main.locked select:disabled,.main.locked textarea:disabled{
    opacity:.7;cursor:not-allowed;-webkit-text-fill-color:var(--text);color:var(--text)}
  .main.locked button:disabled{opacity:.45;cursor:not-allowed}
  .main.locked .pill{opacity:1;cursor:pointer}

  /* ---- unit suffix inside T1 / SVA / C7 fields ---- */
  .ufield{position:relative}
  .ufield input[type=number]{text-align:right;padding-right:28px}
  .ufield .usuf{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;
    color:var(--faint);pointer-events:none;display:none;font-family:var(--mono)}
  .ufield.hasval .usuf{display:block}

  /* ---- hybrid construct badge ---- */
  .hybadge{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--amber);
    background:var(--amber-dim);border:1px solid var(--amber);border-radius:6px;padding:3px 9px;white-space:nowrap}

  /* ---- Excel / export preview ---- */
  .xls{max-width:100%}
  .xlsbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .xlsbar .ct{font-size:13px;font-weight:600;color:var(--text)}
  .xlsbar .cs{font-size:11px;color:var(--faint);margin-top:2px;max-width:540px}
  .xlsbtns{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .fsbar{background:var(--panel2);border:1px solid var(--border2);border-radius:11px;padding:11px 13px;margin-bottom:13px}
  .fsrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .fsrow b{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan);font-weight:700}
  .fsstat{font-size:11.5px;font-family:var(--mono)}
  .fsstat.on{color:var(--green)} .fsstat.idle{color:var(--amber)} .fsstat.off{color:var(--faint)}
  .fsstat.err{color:var(--red)}
  .fsmini-sync{display:inline-block;color:var(--amber);font-size:13px}
  .fsmini-warn{display:inline-block;color:var(--amber);font-size:13px}
  .fsmini-err{display:inline-block;color:var(--red);font-size:13px}
  .sessbox{margin-bottom:14px}
  .sessgrid{display:flex;gap:10px;flex-wrap:wrap}
  .sesscard{flex:1;min-width:210px;background:var(--panel2);border:1px solid var(--border2);
    border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
  .sesscard .btn{width:100%;justify-content:center;padding:11px 12px;font-size:13.5px}
  .sesstag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan);font-weight:700}
  .sessnote{margin-top:9px;padding:9px 11px;border-radius:9px;background:var(--panel2);
    border:1px solid var(--border2);font-size:11.5px;font-family:var(--mono);color:var(--muted)}
  .sessnote.ok{color:var(--green);border-color:var(--green-dim)}
  .sessnote.warn{color:var(--amber);border-color:var(--amber-dim);background:rgba(240,169,59,.07)}
  .mn{font-family:var(--mono);font-size:.94em}
  #copyArea{width:100%;height:150px;background:var(--panel);border:1px solid var(--border2);
    color:var(--muted);border-radius:9px;padding:9px;font-family:var(--mono);font-size:10.5px;resize:vertical}
  .moresave{background:var(--panel2);border:1px solid var(--border2);border-radius:11px;
    padding:11px 13px;margin-bottom:13px}
  .moresave summary{cursor:pointer;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);font-weight:700}
  .cldform{display:flex;gap:7px;flex-wrap:wrap}
  .cldform input{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--border2);color:var(--text);
    border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11.5px}
  .cldform input#cldTok{flex:0 0 130px;min-width:110px}
  .fsbtns{display:flex;gap:7px;flex-wrap:wrap}
  .fsmini{display:inline-flex;align-items:center}
  .fsmini-on{display:inline-block;color:var(--green);font-size:13px;text-shadow:0 0 6px rgba(70,201,139,.6)}
  @keyframes fsPulse{0%{transform:scale(1)}30%{transform:scale(1.5);text-shadow:0 0 13px rgba(70,201,139,1)}100%{transform:scale(1);text-shadow:0 0 6px rgba(70,201,139,.6)}}
  .fsmini-on.pulse{animation:fsPulse .5s ease-out}
  @media (prefers-reduced-motion:reduce){.fsmini-on.pulse{animation:none}}
  .linkremind{display:flex;flex-shrink:0;align-items:center;gap:11px;flex-wrap:wrap;padding:11px 16px;background:var(--amber-dim);border-bottom:1px solid rgba(240,169,59,.45)}
  .linkremind .lrico{color:var(--amber);font-size:16px;line-height:1}
  .linkremind .lrmsg{flex:1;min-width:210px;font-size:12.5px;line-height:1.45;color:var(--text)}
  .linkremind .lrmsg b{color:var(--amber);font-weight:700}
  .linkremind code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:var(--text)}
  .linkremind .lrbtns{display:flex;gap:7px;flex-shrink:0}
  .xlswrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:calc(100vh - 230px)}
  .xlstbl{border-collapse:collapse;font-family:var(--mono);font-size:11px;white-space:nowrap}
  .xlstbl th,.xlstbl td{border:1px solid var(--border);padding:2px 4px;text-align:right}
  .xlstbl thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);z-index:2;
    font-size:7.5px;text-transform:uppercase;letter-spacing:0;text-align:center;font-weight:700;
    white-space:normal;line-height:1.05;vertical-align:bottom}
  .xlstbl tbody tr:nth-child(even){background:rgba(255,255,255,.022)}
  .xlstbl tbody tr:hover{background:var(--cyan-dim)}
  .xlstbl tbody td:first-child,.xlstbl thead th:first-child{position:sticky;left:0;background:var(--panel);
    text-align:center;color:var(--faint);z-index:1}
  .xlstbl thead th:first-child{z-index:3}
  .xlstbl tbody td.miss{color:var(--faint)}

  /* ---- interaction polish: keyboard focus rings + tactile press ---- */
  .btn:focus-visible,.iconbtn:focus-visible,.seg:focus-visible,.pill:focus-visible,.chip:focus-visible,
  .tg:focus-visible,.hobtn:focus-visible,.hotgl:focus-visible,.lockbtn:focus-visible{
    outline:2px solid var(--cyan);outline-offset:2px}
  .rosteritem:focus-visible,.ssitem .ssh:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
  .btn:active,.iconbtn:active,.seg:active,.chip:active,.tg:active,.hobtn:active{transform:translateY(1px)}

</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><h1><span class="dot">◆</span>CDR Study</h1></div>
  <div class="nav" id="entryNav">
    <button class="iconbtn" id="prevBtn" title="Previous">‹</button>
    <span class="counter" id="counter">— / —</span>
    <button class="iconbtn" id="nextBtn" title="Next">›</button>
    <button class="btn primary" id="newBtn">+ New</button>
  </div>
</div>

<div class="linkremind" id="linkRemind" style="display:none"></div>

<div class="viewbar">
  <button class="seg on" data-view="entry"><span class="si">✎</span>Data</button>
  <button class="seg" data-view="dash"><span class="si">▤</span>Analysis</button>
  <button class="seg" data-view="rely"><span class="si">◷</span>Reliability</button>
  <button class="seg" data-view="excel"><span class="si">▦</span>Export</button>
</div>

<div class="shell" id="shell">
  <aside class="roster"><h2>Patients</h2><div id="rosterList"></div></aside>
  <main class="main" id="main"></main>
</div>

<div class="actionbar">
  <button class="iconbtn" id="undoBtn" title="Undo" disabled>↶</button>
  <button class="iconbtn" id="redoBtn" title="Redo" disabled>↷</button>
  <div class="savegrp">
    <div class="savestate" id="saveState"><span class="sdot"></span><span id="saveText">Saved</span></div>
    <span class="counter pcount" id="totalCount" style="color:var(--muted)"></span>
    <span class="fsmini" id="fsMini"></span><span class="fsmini" id="cloudMini"></span>
  </div>
  <div class="lockwrap" id="lockWrap"></div>
  <div class="spacer"></div>
  <input type="file" id="fileInput" class="file-hidden" accept=".json">
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const LEVELS=["C2/3","C3/4","C4/5","C5/6","C6/7","C7/T1"];
const TPS=[
  {key:"PreOp",label:"Pre-op",short:"PO"},{key:"2w",label:"2 wk",short:"2W"},{key:"6m",label:"6 mo",short:"6M"},
  {key:"1y",label:"1 yr",short:"1Y"},{key:"2y",label:"2 yr",short:"2Y"}];
const IMPLANTS=["ProDisc","Mobi-C","Prestige"];
const STORE="cdr_study_v3";
const OLD="cdr_study_v2";
const RESET_VERSION=3;  // bump to force a one-time wipe to an empty study (demo data removed)
const RANGE={static:[-30,40],flex:[-30,25],ext:[-15,40],galign:[-40,60],gflex:[-60,40],gext:[-20,70],asd:[0,4],t1slope:[-20,60],sva:[-30,90],c7slope:[-20,60]};
const ROM_FLAG={min:-2,max:30};   // segmental ROM sanity
const GROM_FLAG={min:0,max:90};   // global ROM sanity
// McAfee HO grading (token + description); HO is a post-op finding only
const HO_GRADES=[["0","None"],["I","HO present, not within the disc space"],["II","HO in the disc space; motion preserved"],["III","Bridging ossification; motion still present"],["IV","Complete bridging / ankylosis; no motion"]];
function isPostop(tk){return tk!=="PreOp";}

let state={patients:[],current:-1,requireHO:true};
let activeTP="PreOp";
let view="entry";
let dirty=false;
let saveFailed=false;

/* ---- model ---- */
function blankTP(){
  const o={static:{},flex:{},ext:{},romLegacy:{},galign:"",gflex:"",gext:"",gromLegacy:"",asd:{},asdLegacy:"",ho:{},t1slope:"",t1nv:false,sva:"",c7slope:""};
  LEVELS.forEach(l=>{o.static[l]="";o.flex[l]="";o.ext[l]="";o.romLegacy[l]="";});
  return o;
}
function blankPatient(){
  const d={}; TPS.forEach(t=>d[t.key]=blankTP());
  return {initials:"",ic4:"",opdate:"",sex:"",age:"",levels:[],implant:"ProDisc",
          fused:null,fusedLevels:[],isize:{},data:d,notes:"",locked:false};
}
function migrate(p){
  if(p.initials===undefined)p.initials="";
  if(p.locked===undefined)p.locked=false;
  if(p.ic4===undefined)p.ic4=p.id||p.ic||"";
  if(p.opdate===undefined)p.opdate="";
  if(p.fused===undefined)p.fused=null;
  if(!p.fusedLevels)p.fusedLevels=[];
  if(p.implant===undefined||p.implant===null)p.implant="";
  if(!p.levels)p.levels=[];
  if(!p.isize||typeof p.isize!=="object")p.isize={};
  if(!p.data)p.data={};
  TPS.forEach(t=>{
    let d=p.data[t.key];
    if(!d){p.data[t.key]=blankTP();return;}
    ["static","flex","ext","romLegacy"].forEach(k=>{if(!d[k])d[k]={};});
    LEVELS.forEach(l=>{
      ["static","flex","ext","romLegacy"].forEach(k=>{if(d[k][l]===undefined)d[k][l]="";});
      // old model stored ROM directly under 'segrom' -> keep as importable fallback
      if(d.segrom&&d.segrom[l]!==undefined&&d.segrom[l]!==""&&d.romLegacy[l]==="")d.romLegacy[l]=d.segrom[l];
    });
    if(d.galign===undefined)d.galign="";
    if(d.gflex===undefined)d.gflex="";
    if(d.gext===undefined)d.gext="";
    if(d.gromLegacy===undefined)d.gromLegacy=(d.grom!==undefined&&d.grom!=="")?d.grom:"";
    if(typeof d.asd==="string"){d.asdLegacy=d.asd;d.asd={};}
    if(d.asd===undefined||d.asd===null||typeof d.asd!=="object")d.asd={};
    if(d.asdLegacy===undefined)d.asdLegacy="";
    if(d.ho===undefined||d.ho===null||typeof d.ho!=="object")d.ho={};
    if(d.t1slope===undefined)d.t1slope="";
    if(d.t1nv===undefined)d.t1nv=false;
    if(d.sva===undefined)d.sva="";
    if(d.c7slope===undefined)d.c7slope="";
    delete d.segrom; delete d.grom;
  });
  return p;
}

/* ---- ROM ---- */
function romOf(d,l){
  const f=d.flex[l],e=d.ext[l];
  const hasF=(f!==""&&f!=null),hasE=(e!==""&&e!=null);
  if(hasF&&hasE){const fn=parseFloat(f),en=parseFloat(e);
    if(!isNaN(fn)&&!isNaN(en))return{val:+(en-fn).toFixed(1),src:"calc"};}
  if(d.romLegacy&&d.romLegacy[l]!==""&&d.romLegacy[l]!=null){
    const v=parseFloat(d.romLegacy[l]);return{val:isNaN(v)?d.romLegacy[l]:v,src:"legacy"};}
  return{val:"",src:"none"};
}
function gromOf(d){
  const f=d.gflex,e=d.gext;
  if(f!==""&&e!==""){const fn=parseFloat(f),en=parseFloat(e);
    if(!isNaN(fn)&&!isNaN(en))return{val:+(en-fn).toFixed(1),src:"calc"};}
  if(d.gromLegacy!==""&&d.gromLegacy!=null){const v=parseFloat(d.gromLegacy);
    return{val:isNaN(v)?d.gromLegacy:v,src:"legacy"};}
  return{val:"",src:"none"};
}

/* ---- persistence ---- */
function persist(){
  let ok=true;
  try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){ok=false;}
  if(ok)setSaved();else markSaveError();
  if(!applyingHistory)pushHistory();
  if(fileLinked)fileSave();
  if(cloud.on&&!cloudSuppress)cloudSchedule();
}

/* ---- undo / redo: in-memory history of the patient data (resets on reload; data itself persists) ---- */
let histCurrent=null, undoStack=[], redoStack=[], applyingHistory=false;
function snapState(){return JSON.stringify({patients:state.patients,reliability:state.reliability||null});}
function pushHistory(){
  const s=snapState();
  if(s===histCurrent)return;
  if(histCurrent!==null){undoStack.push(histCurrent); if(undoStack.length>40)undoStack.shift();}
  histCurrent=s; redoStack=[]; updateUndoBtns();
}
function applySnap(s){
  applyingHistory=true;
  try{
    const snap=JSON.parse(s);
    state.patients=snap.patients;
    if(snap.reliability)state.reliability=snap.reliability;else delete state.reliability;
    if(state.current>=state.patients.length)state.current=state.patients.length-1;
    if(state.current<0&&state.patients.length)state.current=0;
    persist();
  }finally{applyingHistory=false;}
  renderAll();
}
function undo(){ if(!undoStack.length)return; redoStack.push(histCurrent); histCurrent=undoStack.pop(); applySnap(histCurrent); updateUndoBtns(); toast("Undo"); }
function redo(){ if(!redoStack.length)return; undoStack.push(histCurrent); histCurrent=redoStack.pop(); applySnap(histCurrent); updateUndoBtns(); toast("Redo"); }
function updateUndoBtns(){ const u=document.getElementById("undoBtn"),r=document.getElementById("redoBtn"); if(u)u.disabled=!undoStack.length; if(r)r.disabled=!redoStack.length; }
function restore(){
  let loaded=false;
  try{
    let s=localStorage.getItem(STORE);
    if(!s){ // one-time migration from old key
      const old=localStorage.getItem(OLD);
      if(old){try{localStorage.setItem(OLD+"_backup",old);}catch(e){} s=old;}
    }
    if(s){state=JSON.parse(s);if(!state.patients)state.patients=[];
      state.patients=state.patients.map(migrate);loaded=true;}
  }catch(e){}
  if(!state||typeof state!=="object")state={};
  if(!Array.isArray(state.patients))state.patients=[];
  if(state.requireHO===undefined)state.requireHO=true;
  // one-time purge: clear the built-in demo cohort so the study starts empty, and never re-seed
  if(state.resetGen!==RESET_VERSION){
    if(loaded&&state.patients.length){try{localStorage.setItem(STORE+"_preseed",JSON.stringify(state));}catch(e){}} // keep a recovery copy of whatever was there
    state.patients=[];
    state.current=-1;
    state.resetGen=RESET_VERSION;
    try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
  }
  if(typeof state.current!=="number")state.current=-1;
  if(state.current>=state.patients.length)state.current=state.patients.length-1;
  if(state.current<0&&state.patients.length)state.current=0;
}
function markDirty(){dirty=true;const e=document.getElementById("saveState");
  e.classList.add("dirty");document.getElementById("saveText").textContent="Saving…";}
function setSaved(){dirty=false;saveFailed=false;const e=document.getElementById("saveState");
  e.classList.remove("dirty","error");document.getElementById("saveText").textContent="Saved";}
// localStorage write failed (quota exceeded / private mode): never show a false "Saved"
function markSaveError(){
  const firstTime=!saveFailed;
  saveFailed=true;dirty=true;
  const e=document.getElementById("saveState");
  if(e){e.classList.add("dirty","error");const t=document.getElementById("saveText");if(t)t.textContent="Not saved";}
  if(firstTime)toast(fileLinked
    ? "⚠ Browser storage is full — but your linked file is still being saved to disk."
    : "⚠ Couldn’t save to this browser (storage full / private mode). Link a file in Export to keep your data safe.");
}
let saveTimer=null;
function scheduleSave(){markDirty();clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{persist();renderRoster();renderSessionBar();},400);}

/* ---- completeness ---- */
function isFused(p,l){return p.fused&&p.fusedLevels.includes(l);}
// adjacent segments = level immediately above topmost operated, and below bottommost operated
function adjacentLevels(p){
  if(!p||!p.levels||!p.levels.length)return{upper:null,lower:null,top:null,bot:null};
  const idxs=p.levels.map(l=>LEVELS.indexOf(l)).filter(i=>i>=0).sort((a,b)=>a-b);
  const ti=idxs[0],bi=idxs[idxs.length-1];
  return{
    top:LEVELS[ti],bot:LEVELS[bi],
    upper:ti-1>=0?LEVELS[ti-1]:null,
    lower:bi+1<LEVELS.length?LEVELS[bi+1]:null
  };
}
function asdVal(d,l){return (d.asd&&d.asd[l]!=null)?d.asd[l]:"";}
function hoVal(d,l){return (d.ho&&d.ho[l]!=null)?d.ho[l]:"";}
function anyEntered(p,tk){const d=p.data[tk];let a=false;
  LEVELS.forEach(l=>{if(d.static[l]!==""||d.flex[l]!==""||d.ext[l]!=="")a=true;});
  if(d.galign!==""||d.gflex!==""||d.gext!==""||d.t1slope!==""||d.sva!==""||d.c7slope!=="")a=true;
  if(d.asd&&Object.keys(d.asd).some(k=>d.asd[k]!==""&&d.asd[k]!=null))a=true;
  if(d.ho&&Object.keys(d.ho).some(k=>d.ho[k]!==""&&d.ho[k]!=null))a=true;
  if(d.asdLegacy&&d.asdLegacy!=="")a=true;
  return a;}
function tpStatus(p,tk){
  const d=p.data[tk];
  if(!anyEntered(p,tk))return"empty";
  if(!p.levels.length)return"part";           // not "complete" until levels are chosen
  let need=0,have=0;
  p.levels.forEach(l=>{
    need++; if(d.static[l]!=="")have++;        // Static: every operated level
    if(!isFused(p,l)){                         // Flex/Ext: CDR (non-fused) levels only
      need++; if(d.flex[l]!=="")have++;
      need++; if(d.ext[l]!=="")have++;
    }
  });
  ["galign","gflex","gext"].forEach(g=>{need++; if(d[g]!=="")have++;});
  need++; if(d.sva!=="")have++;                          // C2–C7 SVA: required every timepoint
  if(!d.t1nv){need++; if(d.t1slope!=="")have++;}         // T1 slope: required unless 'T1 not visible'
  const adj=adjacentLevels(p);                  // ASD: each adjacent segment that exists
  [adj.upper,adj.lower].forEach(al=>{if(al){need++; if(asdVal(d,al)!=="")have++;}});
  if(state.requireHO!==false && isPostop(tk)){          // HO: each CDR level at post-op timepoints
    p.levels.forEach(l=>{if(!isFused(p,l)){need++; if(hoVal(d,l)!=="")have++;}});
  }
  return have>=need?"full":"part";
}
function patientStatus(p){
  if(!p)return"empty";let full=0,any=false;
  TPS.forEach(t=>{const s=tpStatus(p,t.key);if(s!=="empty")any=true;if(s==="full")full++;});
  if(!any)return"empty";return full===TPS.length?"full":"part";
}

/* roster status dot: red incomplete · blue complete · green locked (confirmed) */
function rosterDot(p){if(p&&p.locked)return "green";return patientStatus(p)==="full"?"blue":"red";}
function isHybrid(p){return !!(p&&p.fused&&p.fusedLevels&&p.fusedLevels.filter(l=>p.levels.includes(l)).length);}

/* ---- per-patient lock + delete ---- */
function applyLock(p){
  const m=document.getElementById("main");if(!m)return;
  m.classList.toggle("locked",!!p.locked);
  if(!p.locked)return;
  m.querySelectorAll("input,select,textarea,button").forEach(c=>{
    if(c.classList.contains("pill"))return;       // keep timepoint navigation usable
    if(c.hasAttribute("data-nolock"))return;      // keep Delete / inline Unlock usable
    c.disabled=true;});
}
function lockBody(){                                // re-disable fields after a timepoint re-render

}
function renderLockBar(){
  const w=document.getElementById("lockWrap");if(!w)return;
  const ok=view==="entry"&&state.current>=0&&state.patients[state.current];
  if(!ok){w.innerHTML="";return;}
  const p=state.patients[state.current];
  w.innerHTML=p.locked
    ? `<button class="btn lockbtn locked" id="lockToggle"><span>🔒</span>Saved &amp; locked — Unlock to edit</button>`
    : `<button class="btn lockbtn" id="lockToggle"><span>🔓</span>Save</button>`;

}
function toggleLock(){
  const p=state.patients[state.current];if(!p)return;
  if(p.locked){
    if(confirm("This record is locked.\n\nUnlock it to make changes?")){
      p.locked=false;persist();renderAll();toast("Record unlocked — you can edit");}
  }else{
    if(confirm(`Save ${p.initials||"this patient"}?\n\nThe record will be locked read-only (your entries are already auto-saved). You’ll be asked to unlock before any further change.`)){
      p.locked=true;persist();renderAll();toast("Saved & locked");}
  }
}
function deletePatient(){
  const di=state.current,p=state.patients[di];if(!p)return;
  const name=p.initials||"this patient";
  if(!confirm(`Delete ${name}?\n\nThis permanently removes the patient and all their measurements.`))return;
  if(!confirm(`Are you absolutely sure?\n\nThis cannot be undone.`))return;
  state.patients.splice(di,1);
  // keep reliability subset/reads aligned to the shifted indices
  if(state.reliability&&Array.isArray(state.reliability.subset)){
    state.reliability.subset=state.reliability.subset.filter(i=>i!==di).map(i=>i>di?i-1:i);
    const nr={};Object.keys(state.reliability.reads||{}).forEach(k=>{const i=+k;if(i===di)return;nr[i>di?i-1:i]=state.reliability.reads[k];});
    state.reliability.reads=nr;}
  r2tp={};                                       // per-patient timepoint tabs are index-keyed — reset after the shift
  if(state.current>=state.patients.length)state.current=state.patients.length-1;
  activeTP="PreOp";persist();renderAll();toast(`Deleted ${name}`);
}

function fmtDate(raw){

function reRenderLevels(p){

function cycleLevel(p,l){
  const inLevels=p.levels.includes(l),inFused=p.fusedLevels.includes(l);
  if(!inLevels){p.levels.push(l);}                                  // off → CDR
  else if(!inFused){
    if(p.fused)p.fusedLevels.push(l);                              // CDR → ACDF (only when fused mode on)
    else p.levels=p.levels.filter(x=>x!==l);                       // CDR → off
  }else{                                                            // ACDF → off
    p.fusedLevels=p.fusedLevels.filter(x=>x!==l);
    p.levels=p.levels.filter(x=>x!==l);
  }
  p.levels.sort((a,b)=>LEVELS.indexOf(a)-LEVELS.indexOf(b));
  p.fusedLevels.sort((a,b)=>LEVELS.indexOf(a)-LEVELS.indexOf(b));
}

/* spreadsheet-style arrow navigation: segmental grid → global row → T1 slope → SVA */
function navMatrix(){
  const rows=[];
  LEVELS.forEach(l=>{
    const r=["static","flex","ext"].map(m=>document.querySelector(`#tpBody input[data-meas="${m}"][data-lvl="${l}"]`)).filter(Boolean);
    if(r.length)rows.push(r);
  });
  const g=["galign","gflex","gext"].map(k=>document.querySelector(`#tpBody input[data-g="${k}"]`)).filter(Boolean);
  if(g.length)rows.push(g);
  ["t1slope","c7slope","sva"].forEach(k=>{
    const e=document.querySelector(`#tpBody input[data-g="${k}"]`);
    if(e&&!e.disabled)rows.push([e]);
  });
  return rows;
}
function gridNav(e,inp){
  const k=e.key;
  if(k!=="ArrowUp"&&k!=="ArrowDown"&&k!=="ArrowLeft"&&k!=="ArrowRight"&&k!=="Enter")return;
  // left/right jump cells only while the field is empty — in a filled field they edit the number
  if((k==="ArrowLeft"||k==="ArrowRight")&&inp.value!=="")return;
  const rows=navMatrix();
  let ri=-1,ci=0;
  rows.forEach((r,i)=>{const j=r.indexOf(inp);if(j>=0){ri=i;ci=j;}});
  if(ri<0)return;
  const clamp=r=>Math.min(ci,r.length-1);
  let t=null;
  if(k==="ArrowUp")t=rows[ri-1]?rows[ri-1][clamp(rows[ri-1])]:null;
  else if(k==="ArrowDown"||k==="Enter")t=rows[ri+1]?rows[ri+1][clamp(rows[ri+1])]:null;
  else if(k==="ArrowLeft")t=rows[ri][ci-1]||(rows[ri-1]?rows[ri-1][rows[ri-1].length-1]:null);
  else t=rows[ri][ci+1]||(rows[ri+1]?rows[ri+1][0]:null);
  if(k==="ArrowUp"||k==="ArrowDown"||k==="Enter")e.preventDefault(); // never let ↑/↓ spin the number value
  if(t){e.preventDefault();t.focus();try{t.select();}catch(_){}}
}

function buildHeader(){
  const h=["No","Initials","IC_last4","OpDate_DDMMYY","Sex","Age","NoOfLevels","OperatedLevels","ACDFLevels"];
  LEVELS.forEach(l=>{h.push(`Type_${l.replace("/","")}`);});            // CDR / ACDF / blank per level
  h.push("Implant","ASD_UpperLevel","ASD_LowerLevel");
  LEVELS.forEach(l=>{const L=l.replace("/","");h.push(`ImplantH_${L}`,`DiscH_preop_${L}`);});
  TPS.forEach(t=>{
    const po=isPostop(t.key);
    LEVELS.forEach(l=>{const L=l.replace("/","");
      h.push(`Static_${t.key}_${L}`,`Flex_${t.key}_${L}`,`Ext_${t.key}_${L}`,`ROM_${t.key}_${L}`);
      if(po)h.push(`HO_${t.key}_${L}`);});                              // HO at post-op timepoints only
    h.push(`GlobalStatic_${t.key}`,`T1slope_${t.key}`,`C2C7_SVA_${t.key}`,`T1_not_visible_${t.key}`,`C7slope_${t.key}`,
           `GlobalFlex_${t.key}`,`GlobalExt_${t.key}`,`GlobalROM_${t.key}`,`ASDupper_${t.key}`,`ASDlower_${t.key}`);
  });
  return h;
}
function patientRow(p,idx){
  const adj=adjacentLevels(p);
  const r=[idx+1,p.initials,p.ic4,p.opdate,p.sex,p.age,p.levels.length,p.levels.join(" / "),
    (p.fused?p.fusedLevels.join(" / "):"")];
  LEVELS.forEach(l=>{r.push(p.levels.includes(l)?(isFused(p,l)?"ACDF":"CDR"):"");});
  r.push(p.implant,adj.upper||"",adj.lower||"");
  LEVELS.forEach(l=>{const s=(p.isize&&p.isize[l])||{};r.push(s.h||"",s.disc||"");});
  TPS.forEach(t=>{const d=p.data[t.key];const po=isPostop(t.key);
    LEVELS.forEach(l=>{const rm=romOf(d,l);
      r.push(d.static[l],d.flex[l],d.ext[l],rm.val);
      if(po){const cdr=p.levels.includes(l)&&!isFused(p,l);r.push(cdr?hoVal(d,l):"");}});
    const g=gromOf(d);
    r.push(d.galign,d.t1slope,d.sva,(d.t1nv?"Y":""),d.c7slope,
           d.gflex,d.gext,g.val,adj.upper?asdVal(d,adj.upper):"",adj.lower?asdVal(d,adj.lower):"");});
  return r;
}
function csvCell(v){v=(v==null?"":String(v));
  if(/^[=@]/.test(v))v="'"+v;                    // stop spreadsheet formula injection from free-text fields
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}

/* ============================================================
   FILE SYNC — auto-save the whole study to a real .json file on
   disk (Edge/Chrome File System Access API). Backup/Restore stays
   as the universal fallback when this isn't available.
   ============================================================ */
const FS_OK=(typeof window!=="undefined")&&("showSaveFilePicker" in window);
let fileHandle=null, fileLinked=false, fileName="";
let remindDismissed=false;
let fsWriting=false, fsPending=false;
function fsIdb(method,val){return new Promise(res=>{
  if(!("indexedDB" in window)){res(null);return;}
  let rq; try{rq=indexedDB.open("cdr_filesync",1);}catch(e){res(null);return;}
  rq.onupgradeneeded=()=>{try{rq.result.createObjectStore("h");}catch(e){}};
  rq.onerror=()=>res(null);
  rq.onsuccess=()=>{try{const db=rq.result,tx=db.transaction("h","readwrite"),st=tx.objectStore("h");
    let r; if(method==="get")r=st.get("handle"); else if(method==="set")r=st.put(val,"handle"); else r=st.delete("handle");
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);}catch(e){res(null);}};
});}
async function fsHasPerm(h,ask){ if(!h||!h.queryPermission)return !!h; const o={mode:"readwrite"};
  if((await h.queryPermission(o))==="granted")return true;
  if(ask&&(await h.requestPermission(o))==="granted")return true; return false; }
async function fileSave(){
  if(!fileLinked||!fileHandle)return;
  if(fsWriting){fsPending=true;return;}
  fsWriting=true;
  try{const w=await fileHandle.createWritable(); await w.write(JSON.stringify(state)); await w.close(); pulseFsMini();}
  catch(e){fileLinked=false; renderFsBar(); toast("Lost the file link — re-link to keep saving to disk");}
  fsWriting=false;
  if(fsPending){fsPending=false;fileSave();}
}
function pulseFsMini(){const el=document.getElementById("fsMiniGlow");if(!el)return;
  el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse");}
async function fileLink(){
  if(!FS_OK){toast("Auto-save to a file needs Edge or Chrome");return;}
  try{
    const h=await window.showSaveFilePicker({suggestedName:fileName||"cdr_study.json",
      types:[{description:"CDR study data",accept:{"application/json":[".json"]}}]});
    fileHandle=h; fileName=h.name||"cdr_study.json"; fileLinked=true;
    await fsIdb("set",h); renderFsBar(); await fileSave();
    toast("Linked — auto-saving to "+fileName);
  }catch(e){ if(e&&e.name!=="AbortError")toast("Couldn’t link that file"); }
}
async function fileOpen(){

    const h=arr[0]; const file=await h.getFile(); loadStateObj(JSON.parse(await file.text()));

}
async function fileReconnect(){
  if(!fileHandle){fileLink();return;}
  if(await fsHasPerm(fileHandle,true)){
    fileLinked=true;
    try{const file=await fileHandle.getFile(); loadStateObj(JSON.parse(await file.text())); resetHistoryBaseline();}catch(e){}
    persist(); renderAll(); renderFsBar(); toast("Reconnected — loaded "+fileName);
  } else toast("Permission denied");
}
async function fileTryReconnect(){
  if(!FS_OK){renderFsBar();return;}
  const h=await fsIdb("get"); if(!h){renderFsBar();return;}
  fileHandle=h; fileName=h.name||"cdr_study.json";

    try{const file=await h.getFile(); loadStateObj(JSON.parse(await file.text())); resetHistoryBaseline(); renderAll();}catch(e){} }
  renderFsBar();
}

/* ============================================================
   CLOUD SYNC — keeps the whole study in a Google Sheet + Drive
   file via an Apps Script web app. Works from any PC that can
   reach the internet; nothing is stored on the hospital machine
   except a cached copy in this browser.
   ============================================================ */
const CLOUD_KEY="cdr_cloud_cfg";
// Running inside the Apps Script web app? Then the server is right here —
// no URL, no key, and no cross-origin request to be blocked.
const GASMODE=(typeof google!=="undefined"&&google.script&&google.script.run);
let cloud={url:"",token:"",rev:0,device:"",on:false};
let cloudSuppress=false, cloudBusy=false, cloudQueued=false, cloudTimer=null;
let cloudState="off", cloudNote="", cloudAt=null, cloudRowsAt=0, cloudBehind=null;

function cloudCfgLoad(){
  try{const s=localStorage.getItem(CLOUD_KEY); if(s)cloud=Object.assign(cloud,JSON.parse(s));}catch(e){}
  if(!cloud.device){
    cloud.device=(navigator.userAgent.indexOf("Windows")>-1?"PC":"Device")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
  }
  cloud.on=!!(cloud.url&&cloud.token);
}
function cloudCfgSave(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud));}catch(e){}}
function cloudSet(st,note){cloudState=st;cloudNote=note||"";renderCloudBar();}

async function cloudCall(action,extra){
  const body=Object.assign({token:cloud.token,action:action,device:cloud.device},extra||{});
  if(GASMODE)return new Promise((res,rej)=>{
    google.script.run
      .withSuccessHandler(j=>{ if(j&&j.error)rej(new Error(j.error)); else res(j); })
      .withFailureHandler(e=>rej(new Error(e&&e.message?e.message:"Couldn't reach the server")))
      .api(body);
  });
  let r;
  try{
    r=await fetch(cloud.url,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(body)});
  }catch(e){throw new Error("Can't reach the sync URL — check the network or the address.");}
  const t=await r.text();
  let j; try{j=JSON.parse(t);}catch(e){throw new Error("That URL didn't return study data. Re-copy the Web app URL.");}
  if(j.error)throw new Error(j.error);
  return j;
}

function cloudSchedule(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudPush(false,false),2500);}

async function cloudPush(force,withRows){
  if(!cloud.on)return;
  if(cloudBusy){cloudQueued=true;return;}
  cloudBusy=true; cloudSet("syncing");
  try{
    const rows=(withRows||Date.now()-cloudRowsAt>120000)&&state.patients.length
      ? [buildHeader(),...state.patients.map((p,i)=>patientRow(p,i))] : null;
    const j=await cloudCall("push",{state:state,baseRev:cloud.rev,force:!!force,rows:rows});
    if(j.conflict){cloudBusy=false;cloudSet("conflict");cloudConflict(j);return;}
    cloud.rev=j.rev; cloudCfgSave(); cloudBehind=null;
    if(rows)cloudRowsAt=Date.now();
    cloudAt=new Date(); cloudSet("ok");
  }catch(e){cloudSet("err",e.message||"Sync failed");}
  cloudBusy=false;
  if(cloudQueued){cloudQueued=false;cloudSchedule();}
}

function cloudAdopt(j){
  cloudSuppress=true;
  try{
    loadStateObj(j.state); cloud.rev=j.rev; cloudCfgSave(); resetHistoryBaseline();
    try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}
  }finally{cloudSuppress=false;}
  cloudBehind=null; cloudAt=new Date(); renderAll(); cloudSet("ok");
}

async function cloudPull(quiet){
  if(!cloud.on)return;
  cloudSet("syncing");
  try{
    const j=await cloudCall("pull",{});
    if(!j.state||!j.state.patients){cloudSet("ok");if(!quiet)toast("The cloud copy is empty — nothing to load");return;}
    cloudAdopt(j);
    toast(`Loaded ${state.patients.length} patient${state.patients.length>1?"s":""} from the cloud`);
  }catch(e){cloudSet("err",e.message||"Couldn't load");}
}

function cloudConflict(j){
  const when=j.updatedAt?new Date(j.updatedAt).toLocaleString():"";
  const who=j.updatedBy||"another device";
  const takeCloud=confirm(
    "The cloud copy has changed since this PC last synced"+(when?" ("+who+", "+when+")":"")+".\n\n"+
    "OK — load the cloud copy (this PC's unsynced edits are replaced)\n"+
    "Cancel — keep this PC's data and overwrite the cloud");
  if(takeCloud){try{cloudAdopt(j);toast("Loaded the cloud copy");}catch(e){cloudSet("err","Couldn't read the cloud copy");}}
  else cloudPush(true,true);
}

async function cloudConnect(url,token){
  url=(url||"").trim(); token=(token||"").trim();
  if(!url||!token){toast("Paste both the Web app URL and the key");return;}
  if(!/^https:\/\//.test(url)){toast("The Web app URL must start with https://");return;}
  const prev={url:cloud.url,token:cloud.token};
  cloud.url=url; cloud.token=token; cloud.on=true; cloudSet("syncing");
  try{
    const m=await cloudCall("meta",{});
    cloudCfgSave();
    if(m.rev>0&&!state.patients.length){await cloudPull(true);toast("Connected — loaded the cloud copy");return;}
    if(m.rev>0&&state.patients.length){
      cloud.rev=m.rev; cloudCfgSave(); cloudBehind=m; cloudSet("choose");
      return;
    }
    cloud.rev=m.rev||0; cloudCfgSave(); cloudSet("ok"); toast("Connected — sending this PC's data up");
    cloudPush(true,true);
  }catch(e){
    cloud.url=prev.url; cloud.token=prev.token; cloud.on=!!(cloud.url&&cloud.token);
    cloudSet(cloud.on?"ok":"off"); toast(e.message||"Couldn't connect");
  }
}

function cloudDisconnect(){
  if(!confirm("Stop syncing to the cloud?\n\nThe data already in the Sheet stays there, and this PC keeps its own copy."))return;
  clearTimeout(cloudTimer);
  cloud={url:"",token:"",rev:0,device:cloud.device,on:false};
  cloudCfgSave(); cloudBehind=null; cloudSet("off"); toast("Disconnected — this PC no longer syncs");
}

async function cloudInit(){
  cloudCfgLoad();
  if(GASMODE){cloud.on=true;cloud.url="(Apps Script)";cloud.token="-";}
  if(!cloud.on){renderCloudBar();return;}
  cloudSet("syncing");
  try{
    const m=await cloudCall("meta",{});
    if(m.rev>cloud.rev){cloudBehind=m;cloudSet(state.patients.length?"choose":"behind");
      if(!state.patients.length)await cloudPull(true);}
    else cloudSet("ok");
  }catch(e){cloudSet("err",e.message||"Offline");}
  renderCloudMini();
}

    : `This PC is <span style="font-family:var(--mono)">${esc(cloud.device)}</span>. “Sync now” also refreshes the readable table in the Sheet.`;

/* ---- shared analysis helpers ---- */
const HOTOK=["0","I","II","III","IV"];
function numv(x){const n=parseFloat(x);return isNaN(n)?null:n;}
function hoNum(t){const i=HOTOK.indexOf(String(t));return i<0?null:i;}
function asdNum(v){const n=parseInt(v,10);return(isNaN(n)||n<0||n>4)?null:n;}
function cdrLevels(p){return (p.levels||[]).filter(l=>!isFused(p,l));}
const TLAB={PreOp:"Pre","2w":"2w","6m":"6m","1y":"1y","2y":"2y"};
const CC={cyan:"#4cc9e6",green:"#46c98b",amber:"#f0a93b",red:"#e8645f",orange:"#e8894f"};
function fmtN(v,d){if(v==null||isNaN(v))return"–";const f=Math.pow(10,d||0);return(Math.round(v*f)/f).toFixed(d||0);}
function niceMax(v){if(!(v>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const m=v/e;
  const n=m<=1?1:m<=1.5?1.5:m<=2?2:m<=3?3:m<=4?4:m<=5?5:m<=6?6:m<=8?8:10;return n*e;}

function barChart(items,opt){
  opt=opt||{};const W=340,H=opt.H||152,mL=32,mR=10,mT=12,mB=opt.mB||30;
  const pw=W-mL-mR,ph=H-mT-mB,base=mT+ph;
  const top=niceMax(Math.max(...items.map(i=>i.value),0.001));
  const y=v=>mT+ph*(1-v/top);
  let g="";for(let i=0;i<=3;i++){const gv=top*i/3,yy=y(gv);
    g+=`<line class="cgl" x1="${mL}" y1="${yy.toFixed(1)}" x2="${W-mR}" y2="${yy.toFixed(1)}"/>`+
       `<text class="caxt" x="${mL-4}" y="${(yy+3).toFixed(1)}" text-anchor="end">${fmtN(gv,top<10?1:0)}</text>`;}
  const n=items.length,band=pw/n;let bars="";
  items.forEach((it,i)=>{const bw=Math.min(band*0.62,40),x=mL+band*i+(band-bw)/2,yv=y(it.value);
    bars+=`<rect x="${x.toFixed(1)}" y="${yv.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-yv).toFixed(1)}" rx="2" fill="${opt.color||CC.cyan}"/>`+
      `<text class="cvalt" x="${(x+bw/2).toFixed(1)}" y="${(yv-3).toFixed(1)}" text-anchor="middle">${fmtN(it.value,1)}</text>`+
      `<text class="caxt" x="${(x+bw/2).toFixed(1)}" y="${(base+11).toFixed(1)}" text-anchor="middle">${esc(it.label)}</text>`+
      (it.n!=null?`<text class="cvalt" x="${(x+bw/2).toFixed(1)}" y="${(base+21).toFixed(1)}" text-anchor="middle" style="fill:var(--faint)">n=${it.n}</text>`:"");});
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><line class="cbl" x1="${mL}" y1="${base}" x2="${W-mR}" y2="${base}"/>${g}${bars}</svg>`;
}
function lineChart(series,xl,opt){
  opt=opt||{};const W=340,H=opt.H||158,mL=32,mR=12,mT=12,mB=24;
  const pw=W-mL-mR,ph=H-mT-mB,base=mT+ph;
  let mx=0;series.forEach(s=>s.data.forEach(v=>{if(v!=null&&v>mx)mx=v;}));
  const top=opt.top||niceMax(mx);const y=v=>mT+ph*(1-v/top);
  const n=xl.length,X=i=>n>1?mL+pw*i/(n-1):mL+pw/2;
  let g="";for(let i=0;i<=3;i++){const gv=top*i/3,yy=y(gv);
    g+=`<line class="cgl" x1="${mL}" y1="${yy.toFixed(1)}" x2="${W-mR}" y2="${yy.toFixed(1)}"/>`+
       `<text class="caxt" x="${mL-4}" y="${(yy+3).toFixed(1)}" text-anchor="end">${fmtN(gv,top<10?1:0)}</text>`;}
  let xlab="";xl.forEach((l,i)=>xlab+=`<text class="caxt" x="${X(i).toFixed(1)}" y="${(base+13).toFixed(1)}" text-anchor="middle">${esc(l)}</text>`);
  let paths="";series.forEach(s=>{let d="",first=true,pts="";
    s.data.forEach((v,i)=>{if(v==null)return;const xx=X(i),yy=y(v);d+=(first?"M":"L")+xx.toFixed(1)+" "+yy.toFixed(1)+" ";first=false;
      pts+=`<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="2.6" fill="${s.color}"/>`;});
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts}`;
    if(opt.labelPoints&&series.length===1)s.data.forEach((v,i)=>{if(v==null)return;
      paths+=`<text class="cvalt" x="${X(i).toFixed(1)}" y="${(y(v)-6).toFixed(1)}" text-anchor="middle">${fmtN(v,opt.dec==null?1:opt.dec)}</text>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><line class="cbl" x1="${mL}" y1="${base}" x2="${W-mR}" y2="${base}"/>${g}${xlab}${paths}</svg>`;
}
function stackChart(cols,segs,opt){
  opt=opt||{};const W=340,H=opt.H||158,mL=22,mR=10,mT=10,mB=24;
  const pw=W-mL-mR,ph=H-mT-mB,base=mT+ph;
  let g="";for(let i=0;i<=2;i++){const f=i/2,yy=base-ph*f;
    g+=`<line class="cgl" x1="${mL}" y1="${yy.toFixed(1)}" x2="${W-mR}" y2="${yy.toFixed(1)}"/>`+
       `<text class="caxt" x="${mL-4}" y="${(yy+3).toFixed(1)}" text-anchor="end">${Math.round(f*100)}</text>`;}
  const n=cols.length,band=pw/n;let bars="";
  cols.forEach((c,i)=>{const bw=Math.min(band*0.6,46),x=mL+band*i+(band-bw)/2;let acc=0;
    c.parts.forEach((pr,si)=>{if(pr<=0)return;const h=ph*pr,yTop=base-ph*acc-h;
      bars+=`<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${segs[si].color}"/>`;
      if(pr>=0.14)bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yTop+h/2+3).toFixed(1)}" text-anchor="middle" style="fill:#0e1216;font-weight:700;font-size:8.5px;font-family:var(--mono)">${Math.round(pr*100)}</text>`;
      acc+=pr;});
    bars+=`<text class="caxt" x="${(x+bw/2).toFixed(1)}" y="${(base+13).toFixed(1)}" text-anchor="middle">${esc(c.label)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><line class="cbl" x1="${mL}" y1="${base}" x2="${W-mR}" y2="${base}"/>${g}${bars}</svg>`;
}
function legendHTML(items){return `<div class="lgnd">`+items.map(it=>`<span><i style="background:${it.color}"></i>${esc(it.name)}</span>`).join("")+`</div>`;}

function renderDashboard(){
  const m=document.getElementById("main"),ps=state.patients;
  if(!ps.length){m.innerHTML=`<div class="dash"><div class="blank"><div><h3>No data</h3>Load or enter patients to see the cohort dashboard.</div></div></div>`;return;}
  const N=ps.length;
  const ages=ps.map(p=>numv(p.age)).filter(v=>v!=null);
  const meanAge=ages.length?ages.reduce((a,b)=>a+b,0)/ages.length:null;
  const fem=ps.filter(p=>p.sex==="F").length;
  const hyb=ps.filter(p=>p.fused&&p.fusedLevels&&p.fusedLevels.length).length;
  const meanLv=ps.reduce((a,p)=>a+((p.levels&&p.levels.length)||0),0)/N;
  const nCDR=ps.reduce((a,p)=>a+cdrLevels(p).length,0);
  const nACDF=ps.reduce((a,p)=>a+((p.fusedLevels||[]).length),0);
  const cards=[{v:N,s:"",l:"Patients"},{v:meanAge==null?"–":fmtN(meanAge,0),s:" y",l:"Mean age"},
    {v:fmtN(meanLv,1),s:"",l:"Levels / patient"},{v:nCDR,s:"",l:"CDR levels"},{v:nACDF,s:"",l:"ACDF levels"},
    {v:Math.round(100*hyb/N),s:"%",l:"Hybrid (ACDF)"},{v:Math.round(100*fem/N),s:"%",l:"Female"}];
  // mean segmental ROM by level @ 2y (operated CDR levels)
  const romByLvl=LEVELS.map(L=>{const vals=[];ps.forEach(p=>{if(p.levels.includes(L)&&!isFused(p,L)){
      const v=numv(romOf(p.data["2y"],L).val);if(v!=null)vals.push(v);}});
    return{label:L,value:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,n:vals.length};}).filter(o=>o.n>0);
  // ROM over time: index segmental + global
  const xl=TPS.map(t=>TLAB[t.key]);
  const idxROM=TPS.map(t=>{const vals=[];ps.forEach(p=>cdrLevels(p).forEach(L=>{const v=numv(romOf(p.data[t.key],L).val);if(v!=null)vals.push(v);}));
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;});
  const glbROM=TPS.map(t=>{const vals=[];ps.forEach(p=>{const v=numv(gromOf(p.data[t.key]).val);if(v!=null)vals.push(v);});
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;});
  // ASD-free proportion over time (adjacent K-L < 2)
  const asdFree=TPS.map(t=>{let den=0,free=0;ps.forEach(p=>{const adj=adjacentLevels(p);const lv=[adj.upper,adj.lower].filter(Boolean);
      if(!lv.length)return;const gr=lv.map(L=>asdNum(p.data[t.key].asd[L])).filter(v=>v!=null);if(!gr.length)return;
      den++;if(Math.max(...gr)<2)free++;});return den?100*free/den:null;});
  // HO grade distribution over time (post-op; per-patient max across CDR levels)
  const postTPS=TPS.filter(t=>isPostop(t.key));
  const hoCols=postTPS.map(t=>{const cnt=[0,0,0,0,0];let tot=0;ps.forEach(p=>{const cl=cdrLevels(p);if(!cl.length)return;
      const gs=cl.map(L=>hoNum(p.data[t.key].ho[L])).filter(v=>v!=null);if(!gs.length)return;cnt[Math.max(...gs)]++;tot++;});
    return{label:TLAB[t.key],parts:tot?cnt.map(c=>c/tot):[0,0,0,0,0],tot};});
  const hoSegs=[{name:"0 None",color:CC.green},{name:"I",color:CC.cyan},{name:"II",color:CC.amber},{name:"III",color:CC.orange},{name:"IV",color:CC.red}];

  // --- added comparisons / analysis ---
  // CDR vs ACDF index-level ROM over time (idxROM above is the CDR line)
  const hasACDF=ps.some(p=>(p.fusedLevels||[]).length);
  const acdfROM=TPS.map(t=>{const v=[];ps.forEach(p=>(p.fusedLevels||[]).forEach(L=>{const x=numv(romOf(p.data[t.key],L).val);if(x!=null)v.push(x);}));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;});
  // adjacent-segment ROM grouped by index construct: pure CDR vs any ACDF/hybrid (compensatory hypermobility = ASD driver)
  const isCDRpt=p=>(cdrLevels(p).length>0 && !((p.fusedLevels||[]).length));
  const isACDFpt=p=>(((p.fusedLevels||[]).length)>0);
  const adjROMfor=fn=>TPS.map(t=>{const v=[];ps.forEach(p=>{if(!fn(p))return;const adj=adjacentLevels(p);
      [adj.upper,adj.lower].forEach(L=>{if(!L)return;const x=numv(romOf(p.data[t.key],L).val);if(x!=null)v.push(x);});});
    return v.length?v.reduce((s,b)=>s+b,0)/v.length:null;});
  const cdrAdjROM=adjROMfor(isCDRpt),acdfAdjROM=adjROMfor(isACDFpt);
  const hasAdjBoth=cdrAdjROM.some(v=>v!=null)&&acdfAdjROM.some(v=>v!=null);
  const nCDRpt=ps.filter(isCDRpt).length,nACDFpt=ps.filter(isACDFpt).length;
  // index segmental ROM @ 2y stratified by McAfee HO grade
  const romByHO=[0,1,2,3,4].map(g=>{const v=[];ps.forEach(p=>cdrLevels(p).forEach(L=>{
      const ho=hoNum(p.data["2y"].ho[L]),r=numv(romOf(p.data["2y"],L).val);
      if(ho===g&&r!=null)v.push(r);}));
    return{label:HOTOK[g],value:v.length?v.reduce((a,b)=>a+b,0)/v.length:0,n:v.length};}).filter(o=>o.n>0);
  // sagittal alignment over time
  const meanG=(t,key)=>{const v=[];ps.forEach(p=>{const x=numv(p.data[t.key][key]);if(x!=null)v.push(x);});return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const t1Mean=TPS.map(t=>meanG(t,"t1slope")),svaMean=TPS.map(t=>meanG(t,"sva"));
  const hasT1=t1Mean.some(v=>v!=null),hasSVA=svaMean.some(v=>v!=null);
  // index ROM retained at 2y vs pre-op (cohort summary)
  const pIdx=idxROM[0],lIdx=idxROM[idxROM.length-1];

/* ============================================================
   RELIABILITY — ICC + weighted kappa (validated)
   ============================================================ */
function icc21(rows){
  const n=rows.length;if(n<2)return null;const k=rows[0].length;
  let grand=0,Nn=0;rows.forEach(r=>r.forEach(v=>{grand+=v;Nn++;}));grand/=Nn;
  const rowM=rows.map(r=>r.reduce((a,b)=>a+b,0)/k),colM=[];
  for(let j=0;j<k;j++){let s=0;for(let i=0;i<n;i++)s+=rows[i][j];colM.push(s/n);}
  let SSR=0;rowM.forEach(mn=>SSR+=(mn-grand)*(mn-grand));SSR*=k;
  let SSC=0;colM.forEach(mn=>SSC+=(mn-grand)*(mn-grand));SSC*=n;
  let SST=0;rows.forEach(r=>r.forEach(v=>SST+=(v-grand)*(v-grand)));
  const SSE=SST-SSR-SSC,MSR=SSR/(n-1),MSC=SSC/(k-1),MSE=SSE/((n-1)*(k-1));
  const den=MSR+(k-1)*MSE+(k/n)*(MSC-MSE);
  return{icc:den===0?NaN:(MSR-MSE)/den,n};
}
function weightedKappa(pairs,R){
  const O=Array.from({length:R},()=>Array(R).fill(0));pairs.forEach(([a,b])=>O[a][b]++);
  const Nn=pairs.length;if(!Nn)return null;
  const rs=Array(R).fill(0),cs=Array(R).fill(0);
  for(let i=0;i<R;i++)for(let j=0;j<R;j++){rs[i]+=O[i][j];cs[j]+=O[i][j];}
  const w=(i,j)=>1-((i-j)*(i-j))/((R-1)*(R-1));let obs=0,exp=0;
  for(let i=0;i<R;i++)for(let j=0;j<R;j++){obs+=w(i,j)*O[i][j];exp+=w(i,j)*rs[i]*cs[j]/Nn;}
  const po=obs/Nn,pe=exp/Nn;return{kappa:(1-pe)===0?NaN:(po-pe)/(1-pe),n:Nn};
}
function iccBadge(v){if(v==null||!isFinite(v))return["na","—"];if(v>=0.9)return["exc","Excellent"];if(v>=0.75)return["good","Good"];if(v>=0.5)return["mod","Moderate"];return["poor","Poor"];}
function kapBadge(v){if(v==null||!isFinite(v))return["na","—"];if(v>=0.81)return["exc","Almost perfect"];if(v>=0.61)return["good","Substantial"];if(v>=0.41)return["mod","Moderate"];if(v>=0.21)return["poor","Fair"];return["poor","Slight"];}

/* ============================================================
   COHORT ANALYSIS — descriptive stats + t-tests (validated)
   Exploratory layer only; confirmatory analysis = mixed model in R/Stata.
   ============================================================ */
function _betacf(x,a,b){const FPMIN=1e-300,EPS=3e-12,qab=a+b,qap=a+1,qam=a-1;
  let c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;
  for(let m=1;m<=300;m++){const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;
    if(Math.abs(del-1)<EPS)break;}
  return h;}
function _gammaln(z){const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let x=z,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++){x++;ser+=g[j]/x;}
  return -tmp+Math.log(2.5066282746310005*ser/z);}
function _ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;
  const bt=Math.exp(_gammaln(a+b)-_gammaln(a)-_gammaln(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2)?bt*_betacf(x,a,b)/a:1-bt*_betacf(1-x,b,a)/b;}
function tCDF(t,df){const x=df/(df+t*t),ib=_ibeta(x,df/2,0.5);return t>=0?1-0.5*ib:0.5*ib;}
function tTwoTailP(t,df){if(!isFinite(t)||df<=0)return null;return Math.max(0,Math.min(1,2*(1-tCDF(Math.abs(t),df))));}
function tInv(p,df){let lo=-1e3,hi=1e3;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(tCDF(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function descr(arr){const v=arr.filter(x=>x!=null&&isFinite(x)),n=v.length;if(!n)return{n:0};
  const m=v.reduce((a,b)=>a+b,0)/n;let ss=0;v.forEach(x=>ss+=(x-m)*(x-m));
  const sd=n>1?Math.sqrt(ss/(n-1)):0,se=n>1?sd/Math.sqrt(n):0,tc=n>1?tInv(0.975,n-1):0;
  return{n,mean:m,sd,se,lo:m-tc*se,hi:m+tc*se};}
function pairedT(pairs){const d=pairs.filter(p=>p[0]!=null&&p[1]!=null&&isFinite(p[0])&&isFinite(p[1])).map(p=>p[1]-p[0]);
  const s=descr(d);if(s.n<2||s.se===0)return{n:s.n};const t=s.mean/s.se;
  return{n:s.n,mean:s.mean,lo:s.lo,hi:s.hi,t,df:s.n-1,p:tTwoTailP(t,s.n-1)};}
function welchT(a,b){const A=descr(a),B=descr(b);if(A.n<2||B.n<2)return{nA:A.n,nB:B.n};
  const va=A.se*A.se,vb=B.se*B.se,se=Math.sqrt(va+vb);if(se===0)return{nA:A.n,nB:B.n};
  const df=(va+vb)*(va+vb)/(va*va/(A.n-1)+vb*vb/(B.n-1)),diff=B.mean-A.mean,t=diff/se;
  const sp=Math.sqrt(((A.n-1)*A.sd*A.sd+(B.n-1)*B.sd*B.sd)/(A.n+B.n-2)),dC=sp?diff/sp:null,tc=tInv(0.975,df);
  return{nA:A.n,nB:B.n,meanA:A.mean,meanB:B.mean,diff,lo:diff-tc*se,hi:diff+tc*se,t,df,p:tTwoTailP(t,df),d:dC};}
function _ms(s){return s.n?`${s.mean.toFixed(1)}±${s.sd.toFixed(1)}`:"–";}
function _pp(p){if(p==null||!isFinite(p))return"–";return p<0.001?"<0.001":p.toFixed(3);}
function analysisSection(ps){
